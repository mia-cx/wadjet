name: CI

on:
  pull_request:
    paths:
      - 'apps/macos/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/macos/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        # the image's default (stable) Xcode, so CI proves the app builds
        # without the local Xcode beta
        run: |
          xcodebuild -version
          swift --version
      - name: Test WadjetKit
        working-directory: apps/macos/WadjetKit
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build + verify
        working-directory: apps/macos
        run: |
          WADJET_NO_OPEN=1 ./run.sh SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          plutil -lint build/Wadjet.app/Contents/Info.plist
          codesign --verify --strict build/Wadjet.app
