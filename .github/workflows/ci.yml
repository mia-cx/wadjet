name: CI

on:
  pull_request:
    paths:
      - 'apps/macos/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/macos/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        # the image's default (stable) Xcode, so CI proves the app builds
        # without the local Xcode beta
        run: |
          xcodebuild -version
          swift --version
      - name: Test WadjetKit
        working-directory: apps/macos/WadjetKit
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build store variant
        working-directory: apps/macos
        run: |
          WADJET_CLEAR_GLASS=0 WADJET_NO_OPEN=1 ./run.sh SWIFT_TREAT_WARNINGS_AS_ERRORS=YES SWIFT_SUPPRESS_WARNINGS=NO
          bash tools/verify-quicklook.sh
          # the store variant must not reference the private glass API
          # (the literals are inlined as immediates under -O, so check the
          # swizzle imports and ClearGlassPatch symbols, not just strings)
          # (`!` pipelines don't trip errexit, so each scan exits explicitly)
          for bin in build/Wadjet.app/Contents/MacOS/Wadjet build/Wadjet.app/Contents/PlugIns/*.appex/Contents/MacOS/*; do
            if strings "$bin" | grep -E 'CABackdropLayer|glassBackground|setFilters:'; then exit 1; fi
            if nm -u "$bin" | grep -E 'class_addMethod|method_setImplementation|imp_implementationWithBlock'; then exit 1; fi
            if nm "$bin" | grep ClearGlassPatch; then exit 1; fi
          done
      - name: Build + verify
        working-directory: apps/macos
        run: |
          # stable Xcode builds the local package with warnings suppressed,
          # which conflicts with warnings as errors
          WADJET_NO_OPEN=1 ./run.sh SWIFT_TREAT_WARNINGS_AS_ERRORS=YES SWIFT_SUPPRESS_WARNINGS=NO
          bash tools/verify-quicklook.sh
